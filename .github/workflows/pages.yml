name: pages
on:
  push:
    branches: [main]
  schedule:
    # 20 minutes after justweight's 2-hourly rebuild (17 */2), so the testnet watcher stage is fresh.
    - cron: "37 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # Reads the network live. If it can't, it republishes the last good data marked stale, or an empty state.
      - run: node src/cli.mjs build | tee -a "$GITHUB_STEP_SUMMARY"
      - run: node scripts/build-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
